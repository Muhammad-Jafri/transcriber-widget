[project]
name = "transcriber-widget"
version = "0.1.0"
description = "Push-to-talk voice transcriber that pastes into any active window"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pyperclip>=1.8.2",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.scripts]
transcriber-widget = "transcriber_widget.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber_widget"]

[tool.uv]
dev-dependencies = [
    "pre-commit>=3.0",
    "pyinstaller>=6",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
